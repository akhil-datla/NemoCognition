services:
  postgres:
    image: postgres:16-alpine
    ports:
      # Use  host :5433 when another Postgres already owns :5432 (e.g. Homebrew).
      - "5433:5432"
    environment:
      POSTGRES_DB: nemocognition
      POSTGRES_USER: nemocognition
      POSTGRES_PASSWORD: nemocognition_dev
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix_data:/data

volumes:
  pgdata:
  phoenix_data:
